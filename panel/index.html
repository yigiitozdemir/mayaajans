<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müşteri Paneli | Maya Ajans</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b0a09'/%3E%3Ctext%20x='32'%20y='46'%20font-family='Arial%20Black,Arial,sans-serif'%20font-size='38'%20font-weight='900'%20text-anchor='middle'%20fill='%23ddd5c7'%3EM%3C/text%3E%3Ccircle%20cx='50'%20cy='16'%20r='6'%20fill='%23a5604a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece5d8;--bg2:#ffffff;--cream:#1c1a17;--dim:#6b655c;--copper:#a5604a;--copper-d:#8a4a36;--line:rgba(28,26,23,.14);--dark:#0f0d0b;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--cream);font-family:'Archivo',sans-serif;line-height:1.6;min-height:100vh}
a{color:var(--copper-d)}
.top{background:var(--dark);color:#e7e0d4;padding:13px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.top .b{display:flex;align-items:center;gap:11px}
.top img{height:30px}
.top .pt{font-family:'Dancing Script',cursive;color:var(--copper);font-size:1.15rem;line-height:1}
.top .pt small{display:block;font-family:'Archivo';color:#8a8478;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase}
.top .who{display:flex;align-items:center;gap:12px;font-size:.8rem;color:#b3aa9b}
.btn{border:none;border-radius:100px;padding:9px 18px;font-weight:600;font-size:.86rem;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.btn-c{background:var(--copper);color:#fff}.btn-c:hover{background:var(--copper-d)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn-x{background:transparent;border:1px solid rgba(231,224,212,.25);color:#b3aa9b;padding:6px 14px}
.wrap{max-width:1080px;margin:0 auto;padding:32px 5% 80px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:.92rem;color:var(--cream)}
label{display:block;font-size:.74rem;font-weight:700;color:var(--dim);margin:0 0 4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
h1{font-family:'Archivo Black',sans-serif;font-size:1.6rem;line-height:1.2}
h2{font-family:'Archivo Black',sans-serif;font-size:1.15rem;margin-bottom:12px}
.lbl{font-family:'Dancing Script',cursive;color:var(--copper);font-size:1.4rem}
.mut{color:var(--dim);font-size:.9rem}
.hide{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mc{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .2s,transform .2s}
.mc:hover{border-color:var(--copper);transform:translateY(-2px)}
.mc .f{font-family:'Archivo Black',sans-serif;font-size:1rem}
.mc .e{font-size:.76rem;color:var(--dim);margin:2px 0 8px;word-break:break-all}
.mc .k{font-size:.72rem;color:var(--copper-d);font-weight:600}
.pill{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:100px;background:rgba(11,10,9,.72);color:#fff}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:10px 4px;margin-bottom:-1px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.on{color:var(--copper);border-bottom-color:var(--copper)}
.pane{display:none}.pane.on{display:block}
.masonry{columns:3 210px;column-gap:14px}
@media(max-width:600px){.masonry{columns:2 150px}}
.it{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;break-inside:avoid;margin-bottom:14px;background:var(--bg2)}
.it .m{position:relative;cursor:pointer}
.it .m img{width:100%;display:block}
.it .m .ph{width:100%;height:150px}
.it .badge{position:absolute;top:8px;left:8px;z-index:2}
.it .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);z-index:2}
.it .play::after{content:'';position:absolute;top:50%;left:53%;transform:translate(-50%,-50%);border-left:15px solid var(--copper);border-top:9px solid transparent;border-bottom:9px solid transparent}
.it .bd{padding:11px 12px}
.it .t{font-weight:600;font-size:.88rem}
.it .d{color:#9a9184;font-size:.7rem;margin-bottom:8px}
.it .st{font-size:.76rem;font-weight:600}.it .st.ok{color:#2f6a49}
.mini{display:flex;gap:6px}.mini button{flex:1;border:none;border-radius:100px;padding:7px 0;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit}
.b-ok{background:var(--copper);color:#fff}.b-rev{background:var(--bg);border:1px solid var(--line)!important;color:var(--dim)}
.sil{position:absolute;top:8px;right:8px;z-index:3;background:rgba(180,40,40,.9);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.8rem}
.dosya{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;text-decoration:none;color:var(--cream)}
.dosya .ad{flex:1;font-weight:600;font-size:.9rem}
.rapor{width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.rapor iframe{width:100%;height:100%;border:0}
.bos{text-align:center;color:var(--dim);padding:34px;border:1px dashed var(--line);border-radius:var(--r)}
.lb{position:fixed;inset:0;background:rgba(8,7,6,.9);z-index:9000;display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb .in{position:relative;max-width:min(92vw,900px)}
.lb img,.lb iframe,.lb video{max-width:100%;max-height:86vh;border-radius:14px;display:block;background:#000}
.lb iframe{width:min(90vw,420px);aspect-ratio:9/16;border:0}
.lbx{position:absolute;top:-15px;right:-15px;width:38px;height:38px;border-radius:50%;background:var(--copper);color:#fff;border:none;font-size:1.2rem;cursor:pointer}
.hata{background:#fbe6e0;border:1px solid #e0a99a;color:#8a3320;padding:10px 14px;border-radius:10px;font-size:.86rem;margin-top:10px}
.yukle{position:fixed;inset:0;background:rgba(236,229,216,.7);z-index:9500;display:none;align-items:center;justify-content:center;font-weight:600;color:var(--copper-d)}
.yukle.on{display:flex}
/* login */
.giris{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.giris .box{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:34px 30px;text-align:center}
.giris img{height:44px;margin-bottom:6px}
.giris h1{font-size:1.3rem;margin:4px 0 2px}
.giris .box form{margin-top:18px;text-align:left}
</style>
</head>
<body>

<div class="yukle" id="yukle">Yükleniyor…</div>

<!-- GİRİŞ -->
<div class="giris" id="giris">
  <div class="box">
    <img src="/images/mayaajans_yataylogo_02-4x.png" alt="Maya Ajans" style="filter:invert(0)">
    <h1>Müşteri Paneli</h1>
    <p class="mut">Devam etmek için giriş yapın</p>
    <form id="girisForm">
      <div class="field"><label>E-posta</label><input type="email" id="gEmail" required></div>
      <div class="field"><label>Şifre</label><input type="password" id="gSifre" required></div>
      <button class="btn btn-c" style="width:100%" type="submit">Giriş Yap</button>
      <div class="hata hide" id="gHata"></div>
    </form>
  </div>
</div>

<!-- UYGULAMA -->
<div id="app" class="hide">
  <div class="top">
    <div class="b"><img src="/images/mayaajans_yataylogo_02-4x.png" alt="Maya Ajans"><span class="pt">Müşteri Paneli<small id="rolEt">Maya Ajans</small></span></div>
    <div class="who"><span id="kimEt"></span><button class="btn btn-x" id="cikis">Çıkış</button></div>
  </div>
  <div class="wrap">
    <div id="adminView" class="hide"></div>
    <div id="clientView" class="hide"></div>
  </div>
</div>

<div class="lb" id="lb"><div class="in"><button class="lbx" id="lbx">×</button><div id="lbc"></div></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB_URL = "https://vmihixfiewrwvsmlxhcb.supabase.co";
const SB_KEY = "sb_publishable_-gsCZBOfbmJrmgnwAPWcew_tiimBwE9";
const WA = "905447631406";
const sb = createClient(SB_URL, SB_KEY);

const $ = s => document.querySelector(s);
const esc = s => (s||"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const ETIKET = {reels:"REELS",post:"POST",video:"VIDEO"};
const GRAD = ["#4a7c6a,#2f5245","#7c5a4a,#4a332a","#5a6a8c,#37425a","#8c6a4a,#5a4230","#6a5a7c,#42364f","#a5604a,#6b3a2a"];
const yukle = on => $("#yukle").classList.toggle("on", on);
function driveEmbed(u){const m=(u||"").match(/\/d\/([^/]+)/)||(u||"").match(/[?&]id=([^&]+)/);return m?"https://drive.google.com/file/d/"+m[1]+"/preview":u;}
function lbAc(h){$("#lbc").innerHTML=h;$("#lb").classList.add("on");}
$("#lbx").onclick=()=>{$("#lb").classList.remove("on");$("#lbc").innerHTML="";};
$("#lb").onclick=e=>{if(e.target.id==="lb"){$("#lb").classList.remove("on");$("#lbc").innerHTML="";}};
const wa = m => window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m),"_blank");
async function slackBildir(mesaj){ try{ await sb.functions.invoke("slack-bildir",{ body:{ mesaj } }); }catch(e){} }

// dosya yükle → public URL
async function uploadFile(file){
  const ad = crypto.randomUUID()+"-"+file.name.replace(/[^\w.\-]/g,"_");
  const { error } = await sb.storage.from("dosyalar").upload(ad, file, {upsert:false});
  if(error) throw error;
  return sb.storage.from("dosyalar").getPublicUrl(ad).data.publicUrl;
}

/* ---------- GİRİŞ ---------- */
$("#girisForm").addEventListener("submit", async e=>{
  e.preventDefault();
  $("#gHata").classList.add("hide");
  yukle(true);
  const { error } = await sb.auth.signInWithPassword({ email:$("#gEmail").value.trim(), password:$("#gSifre").value });
  yukle(false);
  if(error){ $("#gHata").textContent = "Giriş başarısız: e-posta veya şifre hatalı."; $("#gHata").classList.remove("hide"); }
});
$("#cikis").onclick = async()=>{ await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_e, session)=>{ if(session) basla(); });

(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) basla();
})();

let AKTIF_MUSTERI = null;

async function basla(){
  $("#giris").classList.add("hide");
  $("#app").classList.remove("hide");
  const { data:{ user } } = await sb.auth.getUser();
  $("#kimEt").textContent = user?.email || "";
  const { data:admin } = await sb.rpc("is_admin");
  if(admin===true){ $("#rolEt").textContent="Yönetici"; $("#adminView").classList.remove("hide"); $("#clientView").classList.add("hide"); adminYukle(); }
  else { $("#rolEt").textContent="Müşteri"; $("#clientView").classList.remove("hide"); $("#adminView").classList.add("hide"); musteriYukle(user.email); }
}

/* ==================== YÖNETİCİ ==================== */
async function adminYukle(){
  yukle(true);
  const { data:list, error } = await sb.from("musteriler").select("*, onaylar(*), dosyalar(*)").order("firma");
  yukle(false);
  const av = $("#adminView");
  if(error){ av.innerHTML='<div class="hata">Veri alınamadı: '+esc(error.message)+'</div>'; return; }
  av.innerHTML =
    '<span class="lbl">yönetim</span><h1 style="margin-bottom:18px">Müşteriler</h1>'+
    '<div class="grid" id="mliste">'+
      (list||[]).map((m,i)=>'<div class="mc" data-id="'+m.id+'"><div class="f">'+esc(m.firma)+'</div><div class="e">'+esc(m.email)+'</div>'+
        '<div class="k">'+(m.onaylar?.length||0)+' onay · '+(m.dosyalar?.length||0)+' dosya</div></div>').join('')+
    '</div>'+
    '<div class="card" style="margin-top:20px"><h2>+ Yeni müşteri ekle</h2>'+
      '<div class="row"><div><label>Firma adı</label><input id="yFirma" placeholder="Örn: Özikiz Kasap"></div>'+
      '<div><label>Müşteri e-postası (giriş)</label><input id="yEmail" type="email" placeholder="ornek@firma.com"></div></div>'+
      '<button class="btn btn-c" id="yEkle" style="margin-top:6px">Müşteri Ekle</button>'+
      '<p class="mut" style="margin-top:8px;font-size:.8rem">Not: Müşterinin giriş yapabilmesi için ayrıca Supabase → Authentication → Add user’dan aynı e-posta ile şifre oluşturun.</p>'+
    '</div>'+
    '<div id="detay" style="margin-top:24px"></div>';

  window.__list = list||[];
  document.querySelectorAll("#mliste .mc").forEach(el=>el.onclick=()=>detayAc(el.dataset.id));
  $("#yEkle").onclick = async()=>{
    const firma=$("#yFirma").value.trim(), email=$("#yEmail").value.trim().toLowerCase();
    if(!firma||!email){alert("Firma ve e-posta gerekli.");return;}
    yukle(true);
    const { error } = await sb.from("musteriler").insert({ firma, email });
    yukle(false);
    if(error){alert("Eklenemedi: "+error.message);return;}
    adminYukle();
  };
}

function detayAc(id){
  const m = window.__list.find(x=>x.id===id); if(!m) return;
  AKTIF_MUSTERI = m;
  const d = $("#detay");
  d.innerHTML =
    '<div class="card"><h2>'+esc(m.firma)+' <span class="mut" style="font-weight:400;font-size:.82rem">· '+esc(m.email)+'</span></h2>'+
    '<div class="row"><div><label>Firma adı</label><input id="dFirma" value="'+esc(m.firma)+'"></div>'+
    '<div><label>Performans raporu linki (Looker/Metricool)</label><input id="dRapor" value="'+esc(m.rapor_url||"")+'" placeholder="https://..."></div></div>'+
    '<div class="row" style="margin-top:4px"><button class="btn btn-c" id="dKaydet">Kaydet</button>'+
    '<button class="btn btn-g" id="dSil" style="flex:0;min-width:auto;color:#b02a2a">Müşteriyi Sil</button></div>'+

    '<h2 style="margin-top:22px">Onay içerikleri</h2><div class="masonry" id="dOnay"></div>'+
    '<div class="card" style="margin-top:8px;background:var(--bg)"><b style="font-size:.9rem">+ Onay içeriği ekle</b>'+
      '<div class="row" style="margin-top:8px"><div style="flex:0;min-width:130px"><label>Tür</label><select id="oTur"><option value="reels">Reels</option><option value="post">Post</option><option value="video">Video</option></select></div>'+
      '<div><label>Başlık</label><input id="oBaslik"></div><div style="flex:0;min-width:120px"><label>Tarih</label><input id="oTarih" placeholder="12 Ağustos"></div></div>'+
      '<div class="row"><div><label>Kapak görseli (yükle)</label><input type="file" id="oKapak" accept="image/*"></div>'+
      '<div><label>Video linki (Drive/YouTube — reels/video için)</label><input id="oVideo" placeholder="https://drive.google.com/..."></div></div>'+
      '<button class="btn btn-c" id="oEkle" style="margin-top:6px">Onaya Ekle</button></div>'+

    '<h2 style="margin-top:22px">Dosyalar</h2><div id="dDosya"></div>'+
    '<div class="card" style="margin-top:8px;background:var(--bg)"><b style="font-size:.9rem">+ Dosya ekle</b>'+
      '<div class="row" style="margin-top:8px"><div><label>Dosya adı</label><input id="fAd" placeholder="Marka Kiti"></div></div>'+
      '<div class="row"><div><label>Dosya yükle</label><input type="file" id="fDosya"></div><div><label>...veya link yapıştır</label><input id="fLink" placeholder="https://drive.google.com/..."></div></div>'+
      '<button class="btn btn-c" id="fEkle" style="margin-top:6px">Dosya Ekle</button></div>'+
    '</div>';

  renderAdminOnay(m);
  renderAdminDosya(m);

  $("#dKaydet").onclick = async()=>{
    yukle(true);
    const { error } = await sb.from("musteriler").update({ firma:$("#dFirma").value.trim(), rapor_url:$("#dRapor").value.trim() }).eq("id", m.id);
    yukle(false); if(error){alert("Kaydedilemedi: "+error.message);return;} adminYukle();
  };
  $("#dSil").onclick = async()=>{
    if(!confirm(m.firma+" müşterisini ve tüm içeriğini silmek istediğinize emin misiniz?"))return;
    yukle(true); const { error } = await sb.from("musteriler").delete().eq("id", m.id); yukle(false);
    if(error){alert("Silinemedi: "+error.message);return;} adminYukle();
  };
  $("#oEkle").onclick = async()=>{
    const baslik=$("#oBaslik").value.trim(); if(!baslik){alert("Başlık gerekli.");return;}
    yukle(true);
    try{
      let kapak_url = "";
      const f = $("#oKapak").files[0]; if(f) kapak_url = await uploadFile(f);
      const { error } = await sb.from("onaylar").insert({ musteri_id:m.id, tur:$("#oTur").value, baslik, tarih:$("#oTarih").value.trim(), kapak_url, video_url:$("#oVideo").value.trim(), durum:"bekliyor" });
      if(error) throw error;
      await adminYukle(); detayAc(id);
    }catch(err){ alert("Eklenemedi: "+err.message); }
    yukle(false);
  };
  $("#fEkle").onclick = async()=>{
    const ad=$("#fAd").value.trim(); if(!ad){alert("Dosya adı gerekli.");return;}
    yukle(true);
    try{
      let url = $("#fLink").value.trim();
      const f = $("#fDosya").files[0]; if(f) url = await uploadFile(f);
      if(!url){ alert("Dosya yükleyin veya link girin."); yukle(false); return; }
      const { error } = await sb.from("dosyalar").insert({ musteri_id:m.id, ad, url });
      if(error) throw error;
      await adminYukle(); detayAc(id);
    }catch(err){ alert("Eklenemedi: "+err.message); }
    yukle(false);
  };
  d.scrollIntoView({behavior:"smooth"});
}

function renderAdminOnay(m){
  const box = $("#dOnay");
  if(!m.onaylar?.length){ box.innerHTML='<div class="bos" style="columns:auto">Henüz onay içeriği yok.</div>'; return; }
  box.innerHTML = m.onaylar.map((it,i)=>{
    const g="linear-gradient(150deg,"+GRAD[i%GRAD.length]+")";
    const media = it.kapak_url?'<img src="'+esc(it.kapak_url)+'">':'<div class="ph" style="background:'+g+'"></div>';
    const durum = it.durum==="onaylandi"?'<div class="st ok">✓ Onaylandı</div>':it.durum==="revize"?'<div class="st" style="color:#b3702a">✏️ Revize: '+esc(it.revize_notu||"")+'</div>':'<div class="st mut">⏳ Onay bekliyor</div>';
    return '<div class="it"><button class="sil" data-so="'+it.id+'">×</button><div class="m">'+
      '<span class="badge pill">'+(ETIKET[it.tur]||"")+'</span>'+media+'</div>'+
      '<div class="bd"><div class="t">'+esc(it.baslik)+'</div><div class="d">📅 '+esc(it.tarih||"")+'</div>'+durum+'</div></div>';
  }).join('');
  box.querySelectorAll("[data-so]").forEach(b=>b.onclick=async()=>{ if(!confirm("Silinsin mi?"))return; yukle(true); await sb.from("onaylar").delete().eq("id",b.dataset.so); yukle(false); await adminYukle(); detayAc(m.id); });
}
function renderAdminDosya(m){
  const box=$("#dDosya");
  if(!m.dosyalar?.length){ box.innerHTML='<div class="bos">Henüz dosya yok.</div>'; return; }
  box.innerHTML = m.dosyalar.map(d=>'<div class="dosya"><span class="ad">'+esc(d.ad)+'</span><a href="'+esc(d.url)+'" target="_blank" rel="noopener">Aç ↗</a> <button class="btn btn-g" data-sd="'+d.id+'" style="flex:0;padding:4px 10px;color:#b02a2a">Sil</button></div>').join('');
  box.querySelectorAll("[data-sd]").forEach(b=>b.onclick=async()=>{ if(!confirm("Silinsin mi?"))return; yukle(true); await sb.from("dosyalar").delete().eq("id",b.dataset.sd); yukle(false); await adminYukle(); detayAc(m.id); });
}

/* ==================== MÜŞTERİ ==================== */
async function musteriYukle(email){
  yukle(true);
  const { data:rows, error } = await sb.from("musteriler").select("*, onaylar(*), dosyalar(*)").limit(1);
  yukle(false);
  const cv = $("#clientView");
  if(error){ cv.innerHTML='<div class="hata">Veri alınamadı: '+esc(error.message)+'</div>'; return; }
  const m = rows && rows[0];
  if(!m){ cv.innerHTML='<div class="bos" style="margin-top:20px">👋 Paneliniz hazırlanıyor. İçerikleriniz eklenince burada görünecek.</div>'; return; }
  $("#rolEt").textContent = m.firma;
  cv.innerHTML =
    '<span class="lbl">hoş geldiniz</span><h1 style="margin-bottom:4px">'+esc(m.firma)+'</h1><p class="mut" style="margin-bottom:20px">İçeriklerinizi onaylayın, performansınızı ve dosyalarınızı görün.</p>'+
    '<div class="tabs"><button class="tab on" data-t="onay">İçerik Onayı</button><button class="tab" data-t="perf">Performans</button><button class="tab" data-t="dosya">Dosyalar</button></div>'+
    '<div class="pane on" id="c-onay"></div><div class="pane" id="c-perf"></div><div class="pane" id="c-dosya"></div>';
  cv.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{cv.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");cv.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));$("#c-"+t.dataset.t).classList.add("on");});
  cOnay(m); cPerf(m); cDosya(m);
}
function cOnay(m){
  const box=$("#c-onay"); const liste=m.onaylar||[];
  if(!liste.length){box.innerHTML='<div class="bos">Şu an onay bekleyen içerik yok.</div>';return;}
  box.innerHTML='<div class="masonry">'+liste.map((it,i)=>{
    const g="linear-gradient(150deg,"+GRAD[i%GRAD.length]+")";
    const oyn=it.tur!=="post";
    const media=it.kapak_url?'<img src="'+esc(it.kapak_url)+'">':'<div class="ph" style="background:'+g+'"></div>';
    const ok=it.durum==="onaylandi";
    return '<div class="it"><div class="m" data-o="'+it.id+'"><span class="badge pill">'+(ETIKET[it.tur]||"")+'</span>'+(oyn?'<span class="play"></span>':'')+media+'</div>'+
      '<div class="bd"><div class="t">'+esc(it.baslik)+'</div><div class="d">📅 '+esc(it.tarih||"")+'</div>'+
      (ok?'<div class="st ok">✓ Onayladınız</div>':'<div class="mini"><button class="b-ok" data-ok="'+it.id+'">✓ Onayla</button><button class="b-rev" data-rev="'+it.id+'">Revize</button></div>')+
      '</div></div>';
  }).join('')+'</div>';
  box.querySelectorAll("[data-o]").forEach(el=>el.onclick=()=>{const it=liste.find(x=>x.id===el.dataset.o);if(it.tur!=="post"&&it.video_url)lbAc('<iframe src="'+esc(driveEmbed(it.video_url))+'" allow="autoplay" allowfullscreen></iframe>');else if(it.kapak_url)lbAc('<img src="'+esc(it.kapak_url)+'">');});
  box.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{const it=liste.find(x=>x.id===b.dataset.ok);yukle(true);await sb.from("onaylar").update({durum:"onaylandi"}).eq("id",it.id);slackBildir('✅ '+m.firma+' onayladı — "'+it.baslik+'" ('+(it.tarih||"")+')');yukle(false);b.closest(".mini").outerHTML='<div class="st ok">✓ Onayladınız</div>';});
  box.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{const it=liste.find(x=>x.id===b.dataset.rev);const not=prompt("Revize notunuz:","");if(not===null)return;yukle(true);await sb.from("onaylar").update({durum:"revize",revize_notu:not}).eq("id",it.id);slackBildir('✏️ '+m.firma+' revize istedi — "'+it.baslik+'" ('+(it.tarih||"")+'): '+not);yukle(false);b.closest(".mini").outerHTML='<div class="st" style="color:#b3702a">✏️ Revize iletildi</div>';});
}
function cPerf(m){const box=$("#c-perf");if(!m.rapor_url){box.innerHTML='<div class="bos">Performans raporunuz çok yakında burada olacak.</div>';return;}box.innerHTML='<div class="rapor"><iframe src="'+esc(m.rapor_url)+'" allowfullscreen></iframe></div><a class="btn btn-c" style="margin-top:12px" href="'+esc(m.rapor_url)+'" target="_blank" rel="noopener">Raporu tam ekran aç →</a>';}
function cDosya(m){const box=$("#c-dosya");const l=m.dosyalar||[];if(!l.length){box.innerHTML='<div class="bos">Dosyalarınız çok yakında burada olacak.</div>';return;}box.innerHTML=l.map(d=>'<a class="dosya" href="'+esc(d.url)+'" target="_blank" rel="noopener"><span class="ad">'+esc(d.ad)+'</span><span style="color:var(--copper);font-weight:600">Aç ↗</span></a>').join('');}
</script>
</body>
</html>
