// Maya Ekip · Android: ekip.mayaajans.net'i telefonun Chrome motoruyla tam ekran açar (Trusted Web Activity).
// Bildirimler, girişler ve güncellemeler web programıyla aynıdır; uygulamanın kendisi nadiren güncellenir.
plugins { id 'com.android.application' }

android {
    namespace 'net.mayaajans.ekip'
    compileSdk 35
    defaultConfig {
        applicationId 'net.mayaajans.ekip'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'appName', 'Maya Ekip'
        resValue 'string', 'launchUrl', 'https://ekip.mayaajans.net/'
        resValue 'string', 'providerAuthority', 'net.mayaajans.ekip.fileprovider'
        resValue 'string', 'assetStatements', '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://ekip.mayaajans.net"}}]'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
